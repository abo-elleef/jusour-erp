test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

cloudinary:
  service: Cloudinary
  cloud_name: <%= ENV["CLOUDINARY_CLOUD_NAME"] %>
  api_key: <%= ENV["CLOUDINARY_API_KEY"] %>
  api_secret: <%= ENV["CLOUDINARY_API_SECRET"] %>

<%
  gcs_credentials_path = ENV["GCS_CREDENTIALS_PATH"].presence || ENV["GOOGLE_APPLICATION_CREDENTIALS"].presence
  gcs_project = ENV["GCS_PROJECT"].presence
  if gcs_project.blank? && gcs_credentials_path.present? && File.exist?(gcs_credentials_path)
    gcs_project = JSON.parse(File.read(gcs_credentials_path)).fetch("project_id", nil)
  end
%>

google:
  service: GCS
  project: <%= gcs_project %>
  bucket: <%= ENV.fetch("GCS_BUCKET", "saqr-pos-#{Rails.env}") %>
  <% if gcs_credentials_path.present? %>
  credentials: <%= gcs_credentials_path %>
  <% end %>
