        no_average: "غير متاح"
        no_average_hint: "متوسط المخزون صفر أو سالب في هذه الفترة، فلا يمكن حساب معدل الدوران."
        formula: "معدل الدوران = قيمة المستخدم ÷ متوسط قيمة المخزون، والمتوسط = (أول المدة + آخر المدة) ÷ 2. أيام المخزون = أيام الفترة ÷ معدل الدوران."
        usage_note: "المستخدم يعني ما خرج من النشاط: بيع، استهلاك، تصنيع، هالك، تصفير نهاية اليوم وتسويات الجرد (بعد خصم الزيادة). عند اختيار مخزن واحد يُحسب التحويل الصادر أيضاً."
