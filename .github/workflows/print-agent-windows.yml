name: Print agent Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["print-agent-v*"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: print_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install --omit=optional
      - run: npm run build
      - name: Build installer
        run: iscc installer\SaqrPrintAgent.iss
      - uses: actions/upload-artifact@v4
        with:
          name: SaqrPrintAgent-Setup
          path: print_agent/dist/SaqrPrintAgent-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: print_agent/dist/SaqrPrintAgent-Setup.exe
